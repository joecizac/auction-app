<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Dashboard - Sports Auction</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="team-view-container">
        <!-- Column 1: My Team Details -->
        <div id="my-team-panel" class="team-panel my-team">
            <!-- This will be populated by JavaScript -->
        </div>

        <!-- Column 2: Bidding Area -->
        <div id="bidding-area" class="bidding-area card">
            <h2>Waiting for next player...</h2>
        </div>

        <!-- Column 3: Other Teams -->
        <div class="team-panel other-teams">
            <h3>Other Teams</h3>
            <div id="other-teams-container" class="other-teams-scroller">
                <!-- This will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/team-dashboard.js"></script>
</body>
</html>
