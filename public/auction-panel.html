<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auction Panel - Sports Auction</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="card panel-header">
            <div class="header-left">
                <a href="/admin" class="back-link">&larr;</a>
                <h1 id="auction-title-heading">Auction Name Loading...</h1>
            </div>
            <div class="header-right">
                <a href="#" id="manage-players-link" class="btn btn-secondary">Manage Players</a>
                <a href="#" id="manage-teams-link" class="btn btn-secondary">Manage Teams</a>
                <a href="#" id="edit-auction-link" class="btn btn-secondary">Edit Auction</a>
                <button id="close-auction-btn" class="btn btn-danger">Close Auction</button>
            </div>
        </header>

        <!-- THE FIX: The footer is now the last child of this flex container -->
        <div class="panel-body">
            <!-- Full-width top section for the player pool -->
            <div class="player-pool-section">
                <div class="card">
                    <h2>Player Pool</h2>
                    <!-- Filters will go here -->
                </div>
                <div id="player-grid-container" class="card player-grid">
                    <p>Players will be shown here...</p>
                </div>
            </div>

            <!-- Wrapper for the two bottom columns -->
            <div class="bottom-panels-wrapper">
                <div id="player-details-panel" class="card player-details-panel">
                     <p>Select a player to auction</p>
                </div>
                <div class="card teams-panel">
                     <h2>Teams</h2>
                     <div id="teams-list-container">
                        <!-- Teams will be loaded here -->
                     </div>
                </div>
            </div>

            <footer class="card panel-footer">
                <button class="btn btn-primary">Open Presentation Mode</button>
                <label class="filter-checkbox"><input type="checkbox"> Show Team Balance</label>
            </footer>
        </div>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script src="/auction-panel.js"></script>
</body>
</html>
