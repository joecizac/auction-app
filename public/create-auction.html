<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Auction - Sports Auction</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="form-header">
            <a href="/admin" class="back-link">&larr;</a>
            <h1>Create Auction</h1>
        </div>

        <div class="card form-container">
            <form class="auction-form">
                <div class="form-section">
                    <h2>Auction Details</h2>
                    <!-- THE FIX: This is the correct, full structure for the banner upload -->
                    <div class="form-group">
                        <label for="auction-banner-input">Auction Banner</label>
                        <div class="image-upload-wrapper">
                            <div id="banner-preview" class="image-preview">
                                <span id="banner-preview-text">Image Preview</span>
                            </div>
                            <input type="file" id="auction-banner-input" accept="image/*" style="display: none;">
                            <button type="button" class="btn btn-secondary" onclick="document.getElementById('auction-banner-input').click()">Upload</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="auction-title">Auction Title*</label>
                        <input type="text" id="auction-title" name="auction-title" placeholder="e.g., STPL - 2025" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group" style="flex:1;">
                            <label for="sport-type">Sport*</label>
                            <select id="sport-type" name="sport-type" required>
                                <option value="football">Football</option>
                                <option value="cricket">Cricket</option>
                            </select>
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label for="team-budget">Per Team Budget*</label>
                            <input type="number" id="team-budget" name="team-budget" placeholder="e.g., 10000000" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Bid Increments</h2>
                    <div id="bid-increments-container">
                        <!-- THE FIX: Added 'bid-increment-row' class to the default tier -->
                        <div class="form-row bid-increment-row">
                            <input type="number" placeholder="From">
                            <input type="number" placeholder="To">
                            <input type="number" placeholder="Increment by">
                            <button type="button" class="btn-remove-increment" disabled>&times;</button>
                        </div>
                    </div>
                    <button type="button" id="add-increment-btn" class="btn btn-secondary">Add Tier</button>
                </div>
                
                <div class="form-section">
                    <h2>Rules</h2>
                    <div class="rules-layout">
                        <div class="form-group">
                           <label>Allowed Divisions*</label>
                           <div class="checkbox-group">
                               <label><input type="checkbox" name="division" value="senior_men"> Senior(Men)</label>
                               <label><input type="checkbox" name="division" value="senior_women"> Senior(Women)</label>
                               <label><input type="checkbox" name="division" value="youth_men"> Youth(Men)</label>
                               <label><input type="checkbox" name="division" value="youth_women"> Youth(Women)</label>
                               <label><input type="checkbox" name="division" value="junior_boys"> Junior(Boys)</label>
                               <label><input type="checkbox" name="division" value="junior_girls"> Junior(Girls)</label>
                           </div>
                       </div>
                       <div class="limits-container">
                            <div id="division-limits-container">
                               <!-- Dynamic division limits -->
                            </div>
                           <div id="position-limits-container">
                               <h3 id="position-limits-heading">Position Limits</h3>
                                <div id="position-limits-rows-container">
                                   <!-- Dynamic position limits -->
                                </div>
                           </div>
                       </div>
                    </div>
                </div>

                <div class="form-actions" style="display: flex; justify-content: space-between; align-items: center;">
                    <!-- NEW: Delete button, hidden by default -->
                    <button type="button" id="delete-auction-btn" class="btn btn-danger" style="display: none;">Delete Auction</button>
                    <button type="submit" class="btn btn-primary">Create Auction</button>
                </div>
            </form>
        </div>
    </div>
    <script src="/create-auction.js"></script>
</body>
</html>
