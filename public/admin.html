<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sports Auction</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1>Auctions</h1>
            <label class="filter-checkbox"><input type="checkbox"> Hide Closed</label>
        </header>

        <div class="auctions-grid-wrapper">
            <!-- Auctions will be dynamically inserted here -->
            <div id="auctions-grid" style="display: contents;"></div>

             <!-- The "Create Auction" button -->
            <a href="/admin/create-auction" class="create-auction-card">
                <div class="create-content">
                    <span>+</span>
                    <p>Create New Auction</p>
                </div>
            </a>
        </div>

        <!-- This message will show if there are no auctions -->
        <div id="no-auctions-message" style="display: none;">
            <p>No auctions found. Get started by creating one!</p>
        </div>
    </div>

    <script src="/admin.js"></script>
</body>
</html>
