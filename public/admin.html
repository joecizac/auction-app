<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sports Auction</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <h1>Auctions</h1>
            <div class="header-actions">
                <label class="filter-checkbox"><input type="checkbox"> Hide Closed</label>
            </div>
        </header>

        <!-- NEW: A wrapper to contain both the grid and the create button -->
        <div class="auctions-content-wrapper">
            <!-- The auctions will be dynamically inserted here -->
            <div id="auctions-grid" class="auctions-grid">
                <!-- Hardcoded examples removed -->
            </div>
            <!-- The "Create Auction" button is now inside the wrapper -->
            <a href="/admin/create-auction" class="create-auction-card">
                <div class="create-content">
                    <span>+</span>
                    <p>Create New Auction</p>
                </div>
            </a>
        </div>


        <!-- This message will show if there are no auctions -->
        <div id="no-auctions-message" class="empty-state" style="display: none;">
            <p>No auctions found. Get started by creating one!</p>
        </div>

    </div>

    <!-- Link to our new JavaScript file -->
    <script src="/admin.js"></script>
</body>
</html>
