<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Sports Auction</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>Auctions</h1>
        </header>
        <main>
            <div class="auctions-grid">
                <!-- Example of an active auction card -->
                <div class="auction-card">
                    <img src="https://placehold.co/600x337/004488/FFFFFF?text=STPL" alt="Auction Banner" class="auction-card-banner">
                    <div class="auction-card-info">
                        <h2>STPL - 2025</h2>
                        <p>Football • Created: 25/08/25</p>
                    </div>
                </div>

                <!-- Example of a closed auction card -->
                <div class="auction-card">
                    <img src="https://placehold.co/600x337/f5a623/FFFFFF?text=STCL" alt="Auction Banner" class="auction-card-banner">
                     <div class="closed-overlay">Closed</div>
                    <div class="auction-card-info">
                        <h2>STCL - 2025</h2>
                        <p>Football • Created: 15/07/25</p>
                    </div>
                </div>

                <!-- Create New Auction Card -->
                <a href="/admin/create-auction" class="create-card-link">
                    <div class="auction-card create-card">
                        <div class="create-content">
                            <span>+</span>
                            <p>Create Auction</p>
                        </div>
                    </div>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
